</style>

  if(r.id==="lobby"){ F("sofa",150,120,300,46); F("sofa",150,250,300,46); F("table",270,180,60,60); F("plant",20,20); F("plant",r.w-54,20); F("plant",20,r.h-54); F("plant",r.w-54,r.h-54);
    const k=F("kiosk",r.w/2-40,r.h-90,80,60,"공지<br>보기"); k.addEventListener("click",e=>{ e.stopPropagation(); location.href="/#v=notice"; }); }
  if(r.id==="meet"){ F("table",120,90,180,120); [[110,70],[180,60],[250,70],[110,215],[180,225],[250,215],[95,140],[300,140]].forEach(([x,y])=>F("chair",x,y)); F("board",20,22,90,40,"회의 안건"); }
  if(r.id==="cafe"){ F("counter",20,30,170,50); F("table",250,60,56,56); F("table",320,140,56,56); F("table",230,150,56,56); F("plant",r.w-50,14); }
  if(r.id==="desk"){ F("counter",100,40,220,50); F("chair",150,100); F("chair",250,100); F("plant",20,r.h-56); }
});
function roomAt(x,y){ for(const r of ROOMS){ if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h) return r; } return null; }
function canEnter(r){ return !r||!r.branch||ME.admin||r.branch===ME.branch; }

/* ---- 화면 크기 ---- */
const MB=$("#mapbox"); let SC=1;
function fit(){ SC=Math.min(MB.clientWidth/1600,MB.clientHeight/1000); W.style.transform=`translate(${(MB.clientWidth-1600*SC)/2}px,${(MB.clientHeight-1000*SC)/2}px) scale(${SC})`; }
window.addEventListener("resize",fit); fit();

/* ---- 아바타 ---- */
const AV={}; // id -> {el,x,y,name,branch,st}
function avatar(id,info){ let a=AV[id]; if(!a){ const d=el("av"+(id===ME.id?" me":""),{}); d.innerHTML=`<div class="n"></div><div class="b"></div><div class="st"></div>`; W.appendChild(d); a=AV[id]={el:d}; }
  Object.assign(a,info); a.el.style.left=px(a.x); a.el.style.top=px(a.y);
  a.el.querySelector(".b").textContent=String(a.name||"?").slice(0,1); a.el.querySelector(".b").style.background=BCOL[a.branch]||"#1F8A7A";
  a.el.querySelector(".n").innerHTML=E(a.name)+(a.branch?`<em>${E(a.branch.replace("지사",""))}</em>`:"");
  a.el.querySelector(".st").className="st "+(a.st||"on"); return a; }
function drop(id){ const a=AV[id]; if(a){ a.el.remove(); delete AV[id]; } }
function say(id,text){ const a=AV[id]; if(!a) return; let s=a.el.querySelector(".say"); if(!s){ s=el("say"); a.el.appendChild(s); } s.textContent=text; clearTimeout(a.sayT); a.sayT=setTimeout(()=>s.remove(),6000); }
function emo(id,e){ const a=AV[id]; if(!a) return; const s=el("emo",{},E(e)); a.el.appendChild(s); setTimeout(()=>s.remove(),1700); }

/* ---- 나 ---- */
const start=ROOMS.find(r=>r.id==="lobby");
let pos={x:start.x+start.w/2+(Math.random()*120-60),y:start.y+start.h/2+40}, myst="on", curRoom=roomAt(pos.x,pos.y);
avatar(ME.id,{x:pos.x,y:pos.y,name:ME.name,branch:ME.branch,st:myst});
const ST={on:"근무중",busy:"상담중",away:"자리비움"};
function toast(t){ const o=$("#toast"); o.textContent=t; o.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>o.classList.remove("on"),1800); }
function updWhere(){ const r=roomAt(pos.x,pos.y)||{name:"복도",id:"hall"}; $("#sRoom").textContent=r.name; $("#pRoom").textContent="📍 "+r.name;
  const L=LINKS[r.id]||(r.branch?[["지사 공지·게시판","/#v=notice"]]:[]); $("#where").innerHTML=`<b>${E(r.name)}</b>${r.sub?E(r.sub):"공용 통로"}${L.length?"<br>"+L.map(([t,u])=>`<a href="${u}">${t} ›</a>`).join(""):""}`;
  const here=Object.values(AV).filter(a=>{ const q=roomAt(a.x,a.y); return (q&&q.id)===(r.id); }).length; $("#sHere").textContent=here+"명"; }
function moveTo(nx,ny,send){
  nx=Math.max(24,Math.min(1576,nx)); ny=Math.max(24,Math.min(976,ny));
  const r=roomAt(nx,ny); if(!canEnter(r)){ if(!moveTo.warned||Date.now()-moveTo.warned>1500){ toast(r.name+"는 소속 설계사만 들어갈 수 있습니다."); moveTo.warned=Date.now(); } return false; }
  pos.x=nx; pos.y=ny; avatar(ME.id,{x:nx,y:ny}); const id=(r&&r.id)||"hall"; if(id!==(curRoom&&curRoom.id||"hall")){ curRoom=r; renderLog(); } updWhere(); if(send!==false) sendMove(); return true; }
const keys={}; let target=null;
document.addEventListener("keydown",e=>{ if(e.target&&e.target.tagName==="INPUT") return; const k=e.key.toLowerCase(); if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)){ keys[k]=1; target=null; e.preventDefault(); } });
document.addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=0; });
MB.addEventListener("click",e=>{ if(e.target.closest(".where,.emobar,.kiosk")) return; const rc=W.getBoundingClientRect(); target={x:(e.clientX-rc.left)/SC,y:(e.clientY-rc.top)/SC}; });
setInterval(()=>{ const sp=7; let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0), dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(!dx&&!dy&&target){ const vx=target.x-pos.x, vy=target.y-pos.y, d=Math.hypot(vx,vy); if(d<sp){ target=null; } else { dx=vx/d; dy=vy/d; } }
  if(dx||dy){ const n=Math.hypot(dx,dy)||1; if(!moveTo(pos.x+dx/n*sp,pos.y+dy/n*sp)) target=null; } },33);

/* ---- 실시간 ---- */
let ch=null, lastSent=0, pend=false;
function sendMove(){ if(!ch) return; const now=Date.now(); if(now-lastSent<90){ if(!pend){ pend=true; setTimeout(()=>{ pend=false; sendMove(); },100); } return; } lastSent=now; ch.send({type:"broadcast",event:"mv",payload:{id:ME.id,x:Math.round(pos.x),y:Math.round(pos.y)}}); }
function track(){ if(ch) ch.track({id:ME.id,name:ME.name,branch:ME.branch,x:Math.round(pos.x),y:Math.round(pos.y),st:myst,at:Date.now()}); }
function who(){ const L=Object.values(AV); $("#pCnt").textContent="👥 "+L.length+"명"; $("#sCnt").textContent=L.length+"명";
  $("#who").innerHTML=L.map(a=>`<span class="${a.el.classList.contains("me")?"me":""}">${E(a.name)}${a.branch?" · "+E(a.branch.replace("지사","")):""} ${a.st==="busy"?"🔴":a.st==="away"?"🟡":"🟢"}</span>`).join(""); updWhere(); }
try{
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:20}}});
  ch=sb.channel("grow-office",{config:{presence:{key:ME.id},broadcast:{self:false}}});
  ch.on("presence",{event:"sync"},()=>{ const s=ch.presenceState(); const seen=new Set([ME.id]);
      Object.keys(s).forEach(k=>{ const p=s[k][0]; if(!p||p.id===ME.id) return; seen.add(p.id); const a=AV[p.id]; avatar(p.id,{name:p.name,branch:p.branch,st:p.st,x:a?a.x:p.x,y:a?a.y:p.y}); });
      Object.keys(AV).forEach(id=>{ if(!seen.has(id)) drop(id); }); who(); })
    .on("broadcast",{event:"mv"},({payload:p})=>{ if(AV[p.id]) avatar(p.id,{x:p.x,y:p.y}); })
    .on("broadcast",{event:"chat"},({payload:p})=>{ addMsg(p); })
    .on("broadcast",{event:"emo"},({payload:p})=>{ emo(p.id,p.e); })
    .subscribe(st=>{ const c=$("#pConn"); if(st==="SUBSCRIBED"){ c.classList.remove("off"); c.querySelector("span").textContent="연결됨"; track(); sysMsg(ME.name+"님이 입장했습니다."); }
      else if(st==="CHANNEL_ERROR"||st==="TIMED_OUT"||st==="CLOSED"){ c.classList.add("off"); c.querySelector("span").textContent="연결 끊김"; } });
  setInterval(track,4000);
}catch(e){ $("#pConn span").textContent="연결 실패"; }
who(); updWhere();

/* ---- 채팅 ---- */
let TAB="all"; const LOG=[];
function curId(){ return (curRoom&&curRoom.id)||"hall"; }
function visible(m){ if(m.sys) return true; if(TAB==="all") return m.scope==="all"; return m.scope===curId(); }
function renderLog(){ const L=LOG.filter(visible); $("#log").innerHTML=L.length?L.map(m=>m.sys?`<div class="msg sys">${E(m.text)}</div>`:`<div class="msg"><b>${E(m.name)}</b><small>${E((m.branch||"").replace("지사",""))} · ${E(m.room)} · ${E(m.t)}</small><br>${E(m.text)}</div>`).join(""):'<div class="empty">'+(TAB==="all"?"아직 대화가 없습니다.":"이 방에서 오간 대화가 없습니다.")+'<br>채팅은 저장되지 않고 접속 중인 사람에게만 보입니다.</div>'; const g=$("#log"); g.scrollTop=g.scrollHeight; }
function addMsg(m){ // 지사 사무실 채팅은 그 방 안에 있을 때만 받음
  if(m.scope!=="all"&&m.scope!==curId()) return; LOG.push(m); if(LOG.length>200) LOG.shift(); say(m.id,m.text); renderLog(); }
function sysMsg(t){ LOG.push({sys:true,text:t}); renderLog(); }
$("#send").addEventListener("submit",e=>{ e.preventDefault(); const t=$("#msg").value.trim(); if(!t) return; $("#msg").value="";
  const r=roomAt(pos.x,pos.y); const now=new Date(); const m={id:ME.id,name:ME.name,branch:ME.branch,text:t.slice(0,300),scope:TAB==="all"?"all":curId(),room:r?r.name:"복도",t:String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0")};
  addMsg(m); if(ch) ch.send({type:"broadcast",event:"chat",payload:m}); });
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{ TAB=b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b)); renderLog(); }));
document.querySelectorAll("#stsel button").forEach(b=>b.addEventListener("click",()=>{ myst=b.dataset.st; document.querySelectorAll("#stsel button").forEach(x=>x.classList.toggle("on",x===b)); $("#sSt").textContent=ST[myst]; avatar(ME.id,{st:myst}); track(); who(); }));
const EMO=["👍","❤️","😂","🎉","👏","🔥","☕"]; $("#emobar").innerHTML=EMO.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join("");
$("#emobar").addEventListener("click",e=>{ const b=e.target.closest("[data-e]"); if(!b) return; emo(ME.id,b.dataset.e); if(ch) ch.send({type:"broadcast",event:"emo",payload:{id:ME.id,e:b.dataset.e}}); });
})();
</script>
</body>
</html>
